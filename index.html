<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A life in weeks — three directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F2EA; --card:#FBF8F2; --ink:#1E1B16; --muted:#6F675B; --faint:#9C9384;
  --line:#E4DCCD; --empty:#D6CDBC; --accent:#C8553D; --focus:#3D6FD9; --veil:rgba(246,242,234,.55);
  --barh:48px; --font:"Instrument Sans",system-ui,sans-serif; --display:"Fraunces",Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#14120F; --card:#1C1915; --ink:#EEE7DA; --muted:#A39A88; --faint:#776F61;
    --line:#2D2923; --empty:#3A342C; --accent:#EB7A5E; --focus:#7FA2F0; --veil:rgba(20,18,15,.55);}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none !important}

/* top bar */
.bar{position:sticky;top:0;z-index:30;height:var(--barh);display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--paper);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px;background:var(--line);border-radius:10px;padding:3px;flex:1;max-width:340px}
.tabs button{flex:1;border:0;background:transparent;border-radius:8px;padding:6px 4px;font-weight:600;font-size:14px;color:var(--muted);min-height:34px}
.tabs button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tabs button span{color:var(--faint);font-weight:500;margin-right:3px}
.bar .sp{flex:1}
.ghost{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:500;min-height:34px}
.ghost:disabled{opacity:.35;cursor:default}
main{max-width:640px;margin:0 auto;padding:0 12px}
.pitch{margin:10px 0 8px;color:var(--muted);font-size:13.5px;text-wrap:balance}
.pitch b{color:var(--ink);font-family:var(--display);font-size:17px;font-weight:600;display:block;margin-bottom:2px}
footer{margin:28px 0 40px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
footer input{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 8px;min-height:36px}

/* shared bits */
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-size:13.5px;font-weight:500;min-height:36px;white-space:nowrap}
.chip i{width:11px;height:11px;border-radius:3px;flex:none}
.chip b{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip[aria-pressed=true] b{color:inherit;opacity:.7}
.chip.dash{border-style:dashed;color:var(--muted);background:transparent}
.tray{position:sticky;bottom:0;z-index:20;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;margin:10px -4px 0;padding:10px 10px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px}
.chips::-webkit-scrollbar{display:none}
.ctx{margin-top:9px;font-size:13.5px;color:var(--muted);min-height:40px}
.ctx b{color:var(--ink)}
.row{display:flex;gap:8px;align-items:center}
.row .grow{flex:1;min-width:0}
.txt{width:100%;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;min-height:40px;font-size:16px}
.swatch{flex:none;width:40px;height:40px;border:1px solid var(--line);border-radius:8px;padding:3px;background:var(--paper)}
.swatch::-webkit-color-swatch-wrapper{padding:0}.swatch::-webkit-color-swatch{border:0;border-radius:5px}.swatch::-moz-color-swatch{border:0;border-radius:5px}
.btn{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 12px;font-weight:500;min-height:40px;font-size:14px;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.del{color:var(--accent)}
.hint{margin-top:8px;font-size:12.5px;color:var(--faint)}
.tags{display:flex;flex-wrap:wrap;gap:4px 12px;margin:6px 0 8px;font-size:13px}
.tags i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.evs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.evs button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 10px;font-size:13px;min-height:32px}
.brk{display:grid;grid-template-columns:12px 1fr auto auto;gap:4px 10px;align-items:center;font-size:13.5px;margin-top:8px}
.brk i{width:11px;height:11px;border-radius:3px}
.brk span{color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.endh{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;border:1px dashed var(--faint);border-radius:10px;min-height:44px;color:var(--muted);font-size:13.5px;touch-action:none;cursor:ns-resize;user-select:none;-webkit-user-select:none}
.endh b{color:var(--ink);font-family:var(--display);font-size:17px}
.endh.on{border-color:var(--accent);border-style:solid;color:var(--ink)}
.grip{width:26px;height:4px;border-radius:2px;background:currentColor;opacity:.5}

/* 1 paint */
.p-stats{font-size:13.5px;color:var(--muted);margin-bottom:8px}
.p-stats b{color:var(--ink);font-family:var(--display);font-size:17px}
.gridwrap{position:relative;margin-top:8px}
canvas{display:block;width:100%}
.bubble{position:absolute;z-index:5;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12.5px;font-weight:500;padding:5px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%)}
.adj{display:grid;grid-template-columns:auto 44px 1fr 44px;gap:6px 6px;align-items:center}
.adj output{text-align:center;color:var(--ink);font-weight:500;font-size:14px}
.adj .st{border:1px solid var(--line);background:var(--paper);border-radius:8px;height:40px;font-size:15px;touch-action:none;user-select:none;-webkit-user-select:none}
.adj .st:active{background:var(--line)}
.adj-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}

/* 2 tracks */
.t-head{position:sticky;top:var(--barh);z-index:15;display:grid;background:var(--paper);border-bottom:2px solid var(--ink);padding:6px 0 5px}
.t-head > *{min-width:0;padding:0 4px;text-align:left;border:0;background:transparent}
.t-head small{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-head .v{display:block;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:19px}
.t-head .v i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
.t-head .age{font-family:var(--display);font-size:19px;font-weight:600;line-height:1;padding-top:10px}
.t-body{position:relative;margin-top:8px;user-select:none;-webkit-user-select:none}
.t-axis{position:absolute;left:0;top:0;bottom:0;width:36px}
.t-axis span{position:absolute;right:8px;transform:translateY(-50%);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.t-lanes{position:absolute;left:36px;right:78px;top:0;bottom:0;display:flex;gap:3px}
.lane{flex:1;min-width:0;position:relative;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line) 6px 7px);border-radius:6px;cursor:copy}
.tspan{position:absolute;left:0;right:0;border-radius:6px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.tspan.sel{outline:2.5px solid var(--ink);outline-offset:-1px;z-index:2}
.tl{position:sticky;top:calc(var(--barh) + var(--thead,50px) + 4px);padding:5px 6px;font-size:12.5px;line-height:1.2;overflow:hidden}
.tl b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.tl small{font-size:11.5px;opacity:.8;font-variant-numeric:tabular-nums}
.tspan.tiny .tl{display:none}
.seam{position:absolute;left:0;right:0;height:28px;margin-top:-14px;z-index:4;touch-action:none;cursor:ns-resize;display:flex;align-items:center;justify-content:center}
.seam::after{content:"";width:28px;height:5px;border-radius:3px;background:var(--paper);box-shadow:0 0 0 1.5px var(--ink)}
.seam.on::after{background:var(--accent);box-shadow:0 0 0 1.5px var(--accent);width:100%;height:3px;border-radius:0}
.t-evlane{position:absolute;right:0;top:0;bottom:0;width:74px;cursor:copy;border-left:1px dashed var(--line)}
.tev{position:absolute;left:4px;right:0;transform:translateY(-50%);z-index:3;border:1px solid var(--ink);background:var(--card);border-radius:999px;padding:3px 7px;font-size:11.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;touch-action:none;min-height:24px;text-align:left}
.tev.sel{background:var(--ink);color:var(--paper)}
.tevline{position:absolute;left:36px;right:74px;height:0;border-top:1px dashed var(--ink);opacity:.45;pointer-events:none;z-index:3}
.veil{position:absolute;left:36px;right:78px;bottom:0;background:var(--veil);pointer-events:none;z-index:1}
.nowl{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--accent);pointer-events:none;z-index:5}
.nowl span{position:absolute;left:0;top:-9px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:600;padding:1px 5px;border-radius:4px}
.dragtag{position:fixed;z-index:40;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12.5px;font-weight:500;padding:5px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-150%)}

/* 3 tell */
.prose{font-family:var(--display);font-size:21px;line-height:1.35;margin:4px 0 14px;text-wrap:pretty}
.prose b{font-weight:600}
.prose .stp{white-space:nowrap;display:inline-flex;align-items:center;gap:2px;vertical-align:baseline;border-bottom:2px solid var(--accent)}
.prose .stp button{border:0;background:var(--line);width:30px;height:30px;border-radius:50%;font-family:var(--font);font-size:17px;line-height:1}
.ribbon{display:block;margin-bottom:10px}
.ribbon .lbl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.rb{position:relative;display:flex;height:24px;border-radius:6px;overflow:hidden;background:var(--empty)}
.rb button{height:100%;border:0;border-right:1px solid var(--paper);padding:0;min-width:0}
.rb button.fut{opacity:.4}
.rb .nl{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);pointer-events:none}
.ans{border:1px solid var(--ink);border-radius:12px;padding:12px 14px;margin:14px 0;background:var(--card);animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(4px) scale(.985)}}
@media (prefers-reduced-motion:reduce){.ans{animation:none}}
.ans .q{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:start}
.ans .q button{border:0;background:transparent;color:var(--faint);font-size:18px;line-height:1;width:32px;height:32px;margin:-8px -8px 0 0}
.ans p{margin:6px 0 0;font-family:var(--display);font-size:18px;line-height:1.35}
.ans p b{font-weight:600}
.ans p i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
h2{font-family:var(--display);font-size:17px;font-weight:600;margin:20px 0 6px}
.story{display:grid;grid-template-columns:auto 1fr auto 36px;gap:0 10px;align-items:center}
.srow{display:contents}
.srow > *{padding:9px 0;border-bottom:1px solid var(--line)}
.srow .when{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.srow .what{border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:44px}
.srow .what i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px}
.srow .what i.ring{border:1.5px solid var(--ink);border-radius:50%;background:transparent}
.srow .what small{color:var(--faint);font-weight:400;margin-left:6px}
.srow .len{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.srow .x{border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--faint);font-size:18px;height:100%}
.srow.flash > *{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.prev{font-size:13.5px;color:var(--muted);margin-bottom:8px;min-height:36px}
.prev .p1{color:var(--ink);font-weight:500;margin-bottom:6px}
.prev .p1 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.composer form{display:flex;gap:8px}
</style>
</head>
<body>
<header class="bar">
  <nav class="tabs" role="tablist" aria-label="Design direction">
    <button role="tab" data-view="paint"><span>1</span>Paint</button>
    <button role="tab" data-view="tracks"><span>2</span>Tracks</button>
    <button role="tab" data-view="tell"><span>3</span>Tell</button>
  </nav>
  <div class="sp"></div>
  <button class="ghost" id="undo" disabled>Undo</button>
</header>
<main>
  <p class="pitch" id="pitch"></p>
  <div id="view"></div>
  <footer>
    <label for="birth">Birthday</label><input type="date" id="birth">
    <button class="ghost" id="reset">Reset to sample life</button>
    <span>All three directions edit the same sample life, so you can compare them.</span>
  </footer>
</main>
<div class="dragtag" id="dragtag" hidden></div>

<script>
(() => {
"use strict";
// ============ shared model ============
const DAY = 864e5, WEEK = 7 * DAY, BIG = 99999;
const PAL = ["#D9805F","#4F6D8F","#7FA88B","#E2B85C","#9A7CB8","#5FA3B8","#C76B8A","#8C8A5A","#B5654A","#6E8FD1","#4E9A7A","#C9A227"];
const MONTHS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
const KEY = "lifeweeks.proto.v2";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = new Intl.NumberFormat("en-US");
const fMY = new Intl.DateTimeFormat("en-US", {month:"short", year:"numeric", timeZone:"UTC"});
const fD = new Intl.DateTimeFormat("en-US", {month:"short", day:"numeric", year:"numeric", timeZone:"UTC"});
const view = $("#view");

function parseD(s){ if(!s) return null; const [y,m,d] = s.split("-").map(Number); return y && m && d ? Date.UTC(y, m-1, d) : null; }
function todayMs(){ const n = new Date(); return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()); }
let B, total, nowI, spanW;
function bday(n){ const d = new Date(B); return Date.UTC(d.getUTCFullYear()+n, d.getUTCMonth(), d.getUTCDate()); }
function weekIdx(ms){ if(ms <= B) return 0; let a = new Date(ms).getUTCFullYear() - new Date(B).getUTCFullYear(); if(bday(a) > ms) a--; return a*52 + Math.min(51, Math.floor((ms - bday(a))/WEEK)); }
function wMs(w){ return bday(Math.floor(w/52)) + (w%52)*WEEK; }
const ageOf = w => Math.floor(w/52);
const yrs = w => (w/52).toFixed(1);
const yearOf = w => new Date(wMs(w)).getUTCFullYear();
// weeks are counted from your birthday, so a week can straddle two months: name it by the month it ends in, which keeps "Sep 2025" reading as Sep 2025
const wEnd = w => wMs(w) + 6*DAY;
function wLabel(w){ return w <= 0 ? "Your birth" : w >= spanW ? "The end" : `${fMY.format(wEnd(w))} · you at ${ageOf(w)}`; }
const evMs = e => (e.d && parseD(e.d)) || wEnd(e.w);
const evLabel = e => `${e.d ? fD.format(parseD(e.d)) : fMY.format(wEnd(e.w))} · you at ${ageOf(e.w)}`;
const isoW = w => new Date(wMs(w)).toISOString().slice(0, 10);
// an event like "Gemma born" is someone else's birth: show how old they are now
function bornNote(e){ if(!/\bborn\b|\bbirth of\b/i.test(e.label) || e.w > nowI || e.w <= 0) return ""; const n = nowI - e.w; return n < 52 ? ` · now ${Math.max(1, Math.round(n/4.345))} mo old` : ` · now ${Math.floor(n/52)} yr old`; }
function ink(hex){ const n = parseInt(hex.slice(1), 16), r = n>>16, g = n>>8&255, b = n&255; return (r*299 + g*587 + b*114)/1000 > 150 ? "#1E1B16" : "#fff"; }

function sample(birth = "1990-06-15"){
  const c = (label, i) => ({id:uid(), label, color:PAL[i]});
  const mk = (name, cats, spans) => { const L = {id:uid(), name, cats:cats.map(([l,i]) => c(l,i)), spans:[]}; L.spans = spans.map(([k,a,b]) => ({id:uid(), cat:L.cats[k].id, a:a*52, b:b >= 999 ? BIG : b*52})); return L; };
  const lenses = [
    mk("Chapters", [["Early years",3],["School",2],["College",1],["Career",0],["Retirement",4]], [[0,0,5],[1,5,18],[2,18,22],[3,22,65],[4,65,999]]),
    mk("Living with", [["Parents",5],["On my own",7],["Partner",6],["Partner and kid",11]], [[0,0,18],[1,18,26],[2,26,33],[3,33,51],[2,51,999]]),
    mk("Places", [["Hometown",8],["College town",9],["San Francisco",10]], [[0,0,18],[1,18,22],[2,22,999]])
  ];
  return {birth, exp:80, lenses, active:lenses[1].id, events:[{id:uid(), label:"Graduated", w:22*52-2},{id:uid(), label:"Married", w:28*52+10},{id:uid(), label:"Kid born", w:33*52+38}]};
}
function load(){ try { const s = JSON.parse(localStorage.getItem(KEY)); return s && Array.isArray(s.lenses) ? s : null; } catch(e){ return null; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
let state = load() || sample();
let undo = [];
function snap(){ undo.push(JSON.stringify(state)); if(undo.length > 80) undo.shift(); $("#undo").disabled = false; }
function unsnap(){ undo.pop(); $("#undo").disabled = !undo.length; }
function derive(){
  B = parseD(state.birth); total = Math.round(state.exp*52); nowI = weekIdx(todayMs()); spanW = Math.max(total, nowI + 1);
  if(!state.lenses.find(l => l.id === state.active)) state.active = state.lenses[0]?.id || null;
}
const lensBy = id => state.lenses.find(l => l.id === id);
const active = () => lensBy(state.active);
const catOf = (L, id) => L.cats.find(c => c.id === id);
const spanAt = (L, w) => L.spans.find(s => s.a <= w && w < s.b);
const eb = s => Math.min(s.b, spanW);
function newCat(L, label){ const c = {id:uid(), label, color:PAL[(L.cats.length + state.lenses.indexOf(L)*3) % PAL.length]}; L.cats.push(c); return c; }
function findCat(L, label){ const k = label.trim().toLowerCase(); return L.cats.find(c => c.label.trim().toLowerCase() === k); }
function paint(L, a, b, cat){
  if(b <= a) return null;
  const out = [];
  for(const s of L.spans){
    if(s.b <= a || s.a >= b){ out.push(s); continue; }
    if(s.a < a) out.push({...s, id:uid(), b:a});
    if(s.b > b) out.push({...s, id:uid(), a:b});
  }
  let ns = null; if(cat){ ns = {id:uid(), cat, a, b}; out.push(ns); }
  out.sort((x, y) => x.a - y.a);
  const m = [];
  for(const s of out){ const p = m[m.length-1]; if(p && p.cat === s.cat && p.b >= s.a){ p.b = Math.max(p.b, s.b); if(s === ns) ns = p; } else m.push(s); }
  L.spans = m; return ns;
}
function moveEdge(L, s, side, w){
  const i = L.spans.indexOf(s), prev = L.spans[i-1], next = L.spans[i+1];
  if(side === "a"){
    w = clamp(w, prev ? prev.a + 1 : 0, eb(s) - 1);
    if(prev && (prev.b === s.a || w < prev.b)) prev.b = w;
    s.a = w;
  } else {
    w = clamp(w, s.a + 1, next ? eb(next) - 1 : spanW);
    if(!next && w >= spanW){ s.b = BIG; return; }

    if(uniq.length === 2 && uniq[0].n && uniq[1].n){ const [x, y] = uniq[0].n >= uniq[1].n ? uniq : [uniq[1], uniq[0]]; out += `<p style="color:var(--muted);font-size:16px">${esc(x.c.label)} is ${(x.n/y.n).toFixed(1)}× as long as ${esc(y.c.label.toLowerCase())}.</p>`; }
    return out;
  }
  const L = state.lenses.find(l => l.name && low.includes(l.name.toLowerCase()));
  if(L) return `<p>${esc(L.name)}, across ${yrs(spanW)} years:</p>${brkHTML(L)}`;
  const names = state.lenses.flatMap(l => l.cats.map(c => c.label)).slice(0, 6).join(", ");
  return `<p style="font-size:16px">I can answer about names you've used (${esc(names)}) or about an age or year. Try “How long with parents?” or “What was I doing at 25?”</p>`;
}
VIEWS.tell = {
  pitch:`<b>One line does everything</b>Type what happened in plain words and it lands in the right place. Ask a question in the same box. Tap any line of your story to rewrite it.`,
  render(){
    view.innerHTML = `<p class="prose" id="sProse"></p><div id="sRib"></div><div id="sAns"></div>
      <h2>Your story</h2><div class="story" id="sStory"></div>
      <div class="tray composer"><div class="prev" id="sPrev"></div>
      <form data-form="tell"><input class="txt" id="sIn" placeholder="Tell me something, or ask" autocomplete="off" autocapitalize="sentences" enterkeyhint="send" aria-label="Tell me something about your life, or ask a question"><button class="btn pri" id="sGo">Add</button></form></div>`;
    $("#sIn").addEventListener("input", () => { S.force = S.edit ? S.force : null; sPrev(); });
    this.refresh();
  },
  refresh(){ sBody(); sPrev(); }
};
function sBody(){
  $("#sProse").innerHTML = `You're <b class="num">${ageOf(nowI)}</b>. You expect to live to <span class="stp"><button data-act="sExp" data-d="-1" aria-label="One year less">−</button><b class="num">&nbsp;${state.exp}&nbsp;</b><button data-act="sExp" data-d="1" aria-label="One year more">+</button></span><span>.</span> That's <b class="num">${nf.format(nowI + 1)}</b> weeks behind you and <b class="num">${nf.format(Math.max(0, total - nowI - 1))}</b> ahead.`;
  $("#sRib").innerHTML = state.lenses.map(L => {
    let html = ""; const segs = [];
    let p = 0; for(const s of L.spans){ const a = Math.min(s.a, spanW), b = eb(s); if(b <= a) continue; if(a > p) segs.push([p, a, null]); segs.push([a, b, catOf(L, s.cat)]); p = b; } if(p < spanW) segs.push([p, spanW, null]);
    for(const [a, b, c] of segs){ const cut = clamp(nowI + 1, a, b); for(const [x, y, fut] of [[a, cut, false], [cut, b, true]]){ if(y > x) html += `<button class="${fut ? "fut" : ""}" style="flex:${y - x};background:${c ? esc(c.color) : "transparent"}" ${c ? `data-act="sAskCat" data-q="${esc(c.label)}" aria-label="${esc(c.label)}"` : `tabindex="-1" aria-hidden="true"`}></button>`; } }
    const cs = spanAt(L, nowI), cc = cs && catOf(L, cs.cat);
    return `<div class="ribbon"><div class="lbl"><span>${esc(L.name)}</span><span>${cc ? "Now: " + esc(cc.label) : ""}</span></div><div class="rb">${html}<div class="nl" style="left:${(nowI + 1)/spanW*100}%"></div></div></div>`;
  }).join("");
  $("#sAns").innerHTML = S.answer ? `<div class="ans" role="status"><div class="q"><span>${esc(S.answer.q)}</span><button data-act="sClear" aria-label="Dismiss answer">×</button></div>${S.answer.html}</div>` : "";
  const rows = [];
  for(const L of state.lenses) for(const s of L.spans) rows.push({k:s.a, id:s.id, lens:L, s, c:catOf(L, s.cat)});
  for(const e of state.events) rows.push({k:e.w + .5, id:e.id, e});
  rows.sort((a, b) => a.k - b.k);
  $("#sStory").innerHTML = rows.length ? rows.map(r => r.e
    ? `<div class="srow ${S.flash === r.id ? "flash" : ""}"><span class="when">${fMY.format(evMs(r.e))}</span><button class="what" data-act="sEdit" data-id="${r.id}"><i class="ring"></i>${esc(r.e.label)}<small>you at ${ageOf(r.e.w)}${bornNote(r.e)}</small></button><span class="len"></span><button class="x" data-act="sDel" data-id="${r.id}" aria-label="Delete ${esc(r.e.label)}">×</button></div>`
    : `<div class="srow ${S.flash === r.id ? "flash" : ""}"><span class="when">${yearOf(r.s.a)}–${r.s.b >= spanW ? "" : yearOf(r.s.b)}</span><button class="what" data-act="sEdit" data-id="${r.id}"><i style="background:${esc(r.c.color)}"></i>${esc(r.c.label)}<small>${esc(r.lens.name)}</small></button><span class="len">${yrs(eb(r.s) - Math.min(r.s.a, spanW))} yrs</span><button class="x" data-act="sDel" data-id="${r.id}" aria-label="Delete ${esc(r.c.label)}">×</button></div>`).join("")
    : `<p style="grid-column:1/-1;color:var(--muted)">Nothing here yet. Start with where you grew up: “Lived in Portland until 18”.</p>`;
  S.flash = null;
}
function sPrev(){
  const inp = $("#sIn"), el = $("#sPrev"), go = $("#sGo"); if(!inp) return;
  const p = parse(inp.value, S.force); S.p = p; go.textContent = p.type === "ask" ? "Ask" : S.edit ? "Save" : p.type === "exp" ? "Set" : "Add";
  if(p.type === "empty"){ el.innerHTML = `<div class="chips">${EXAMPLES.map(x => `<button class="chip" data-act="sEx">${esc(x)}</button>`).join("")}</div>`; return; }
  if(p.type === "none"){ el.innerHTML = esc(p.why); return; }
  if(p.type === "ask"){ el.innerHTML = `Press Enter to ask.`; return; }
  if(p.type === "exp"){ el.innerHTML = `<div class="p1">Set your life expectancy to <b>${p.v}</b> years</div>`; return; }
  const kind = p.type === "event" ? "event" : p.lens;
  el.innerHTML = `<div class="p1">${S.edit ? "Replace with → " : ""}${describe(p)}</div><div class="chips"><button class="chip" data-act="sKind" data-id="event" aria-pressed="${kind === "event"}">Event</button>${state.lenses.map(L => `<button class="chip" data-act="sKind" data-id="${L.id}" aria-pressed="${kind === L.id}">${esc(L.name)}</button>`).join("")}</div>`;
}
const sFmt = w => w <= 0 ? "birth" : fMY.format(wEnd(w));
ACT.sEx = b => { const i = $("#sIn"); i.value = b.textContent; S.force = S.edit = null; sPrev(); i.focus(); };
ACT.sKind = b => { S.force = b.dataset.id; sPrev(); $("#sIn").focus(); };
ACT.sExp = b => { snap(); state.exp = clamp(state.exp + +b.dataset.d, Math.max(40, ageOf(nowI) + 1), 110); commit(); };
ACT.sClear = () => { S.answer = null; sBody(); };
ACT.sAskCat = b => { S.answer = {q:`How long: ${b.dataset.q}?`, html:answer(b.dataset.q)}; sBody(); };
ACT.sDel = b => { snap(); const [L, s] = findSpan(b.dataset.id); if(s) L.spans = L.spans.filter(x => x !== s); else state.events = state.events.filter(e => e.id !== b.dataset.id); if(S.edit === b.dataset.id) S.edit = null; commit(); };
ACT.sEdit = b => {
  const id = b.dataset.id, [L, s] = findSpan(id), i = $("#sIn"); S.edit = id;
  if(s){ const c = catOf(L, s.cat); i.value = s.b >= spanW ? `${c.label} since ${sFmt(s.a)}` : s.a <= 0 ? `${c.label} from birth to ${sFmt(s.b)}` : `${c.label} ${sFmt(s.a)} to ${sFmt(s.b)}`; S.force = L.id; }
  else { const e = state.events.find(x => x.id === id); i.value = `${e.label} ${e.d ? fD.format(parseD(e.d)) : sFmt(e.w)}`; S.force = "event"; }
  sPrev(); i.focus();
};
FORM.tell = () => {
  const i = $("#sIn"), p = S.p || parse(i.value, S.force);
  if(p.type === "empty" || p.type === "none"){ i.focus(); return; }
  if(p.type === "ask"){ S.answer = {q:p.text, html:answer(p.text)}; i.value = ""; S.edit = S.force = null; sBody(); sPrev(); $("#sAns").scrollIntoView({block:"center", behavior:"smooth"}); return; }
  snap();
  if(p.type === "exp") state.exp = p.v;
  else {
    if(S.edit){ const [L, s] = findSpan(S.edit); if(s) L.spans = L.spans.filter(x => x !== s); else state.events = state.events.filter(e => e.id !== S.edit); }
    if(p.type === "event"){ const e = {id:uid(), label:p.label, w:p.w}; if(p.exact) e.d = p.d; state.events.push(e); S.flash = e.id; }
    else { const L = lensBy(p.lens), c = findCat(L, p.label) || newCat(L, p.label); if(p.trim) paint(L, p.trim[0], p.trim[1], null); const s = paint(L, p.a, p.b, c.id); S.flash = s?.id; }
  }
  i.value = ""; S.edit = S.force = null; commit();
  const f = $(".srow.flash .what"); if(f) f.scrollIntoView({block:"center", behavior:"smooth"});
};

// ============ boot ============
derive(); $("#birth").value = state.birth;
window.__t = {parse, answer, state:() => state};
show(location.hash.slice(1) || "paint");
if(document.fonts) document.fonts.ready.then(() => cur === "paint" && pDraw());
})();
</script>
